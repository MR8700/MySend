[package]
name = "nova-desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "nova_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nova-crypto = { path = "../../core/nova-crypto" }
nova-engine = { path = "../../core/nova-engine" }
nova-protocol = { path = "../../core/nova-protocol" }
nova-storage = { path = "../../core/nova-storage" }
nova-transport = { path = "../../core/nova-transport" }
libp2p.workspace = true
tauri = { version = "2", features = [] }
# Real, native file save (Settings/Identity screen's "Save QR" button) — a synthetic `<a download>`
# blob-URL click (the previous approach) silently no-ops on Android's WebView (no download-manager
# hook for a `data:`/`blob:` URI there) while still reporting success, since `.click()` itself never
# throws. See `saveQrImage()` in ui/public/app.js.
tauri-plugin-fs = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
