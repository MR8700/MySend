services:
  - type: web
    name: mysend-nova-server
    env: docker
    dockerfilePath: ./server/Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: RUST_LOG
        value: info
      - key: DATABASE_URL
        sync: false # Supabase PostgreSQL connection URI: postgresql://postgres:[PASSWORD]@db.[PROJECT-REF].supabase.co:5432/postgres
