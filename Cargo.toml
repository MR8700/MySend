[workspace]
resolver = "2"
members = [
    "core/nova-crypto",
    "core/nova-protocol",
    "core/nova-storage",
    "core/nova-transport",
    "core/nova-engine",
    "server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["NOVA Core Engineering Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/mysend/nova-chat"

[workspace.dependencies]
# Cryptography
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde", "zeroize"] }
x25519-dalek = { version = "2.0", features = ["static_secrets", "serde", "zeroize"] }
chacha20poly1305 = { version = "0.10", features = ["alloc"] }
hkdf = "0.12"
sha2 = "0.10"
blake3 = "1.5"
bip39 = { version = "2.1", features = ["rand"] }
rand = "0.8"
rand_core = "0.6"
zeroize = { version = "1.8", features = ["derive", "zeroize_derive"] }
argon2 = "0.5"
parking_lot = "0.12"

# Serialization & Data Formats
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ciborium = "0.2"
hex = { version = "0.4", features = ["serde"] }

# Async & Networking
tokio = { version = "1.38", features = ["full"] }
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
futures-util = "0.3"
bytes = "1.6"

# Storage
rusqlite = { version = "0.31", features = ["bundled"] }

# Error Handling & Utilities
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
