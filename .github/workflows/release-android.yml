name: Release Android APK

# Déclenché manuellement, ou automatiquement sur un tag "v*" (ex: v1.2.0).
# Nécessite 4 secrets de dépôt pour signer en release (Settings > Secrets and variables > Actions) :
#   ANDROID_KEYSTORE_BASE64  — `base64 -w0 votre-cle.jks` (ou `certutil -encode` sur Windows)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Sans ces secrets, le build réussit quand même mais Gradle retombe sur la signature debug
# (comportement identique à un build local sans gen/android/keystore.properties).
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-android-release:
    name: build APK release (multi-ABI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: SDK Android + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973"

      - name: Rust stable + cibles Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Dépendances UI
        working-directory: ui
        run: npm ci

      # Régénère jniLibs/**/*.so via le build Rust cross-compilé — évite tout symlink cassé
      # hérité d'une autre machine (voir historique des fixes "splash screen crash").
      - name: Init cible Android Tauri
        working-directory: ui
        run: npx tauri android init
        continue-on-error: true # no-op si gen/android existe déjà dans le repo

      - name: Config signature release
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: ui/src-tauri/gen/android
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.jks
          cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build APK release
        working-directory: ui
        run: npx tauri android build --apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-chat-release-apk
          path: ui/src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error

      - name: Joindre au Release GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ui/src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk
